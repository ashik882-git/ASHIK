<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075aa8"><link rel="manifest" href="manifest.json"><title>CMS Mobile</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3f6fa;color:#17232e}.top{height:64px;background:linear-gradient(135deg,#075aa8,#063f7d);color:#fff;display:flex;align-items:center;padding:0 14px;position:sticky;top:0;z-index:20}.logo{font-weight:800;font-size:18px;flex:1}.top button{background:#ffffff20;border:0;color:#fff;border-radius:10px;padding:9px 12px;margin-left:6px;font-size:17px}main{max-width:720px;margin:auto;padding:14px 14px 90px}.search{width:100%;padding:15px;border:1px solid #dfe6ee;border-radius:16px;font-size:16px;background:#fff}h2{font-size:13px;color:#61707c;letter-spacing:.08em;margin:20px 2px 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #e2e8ee;background:#fff;border-radius:16px;padding:13px;min-height:90px;text-align:left;box-shadow:0 2px 9px #12345a10}.card .ico{font-size:25px}.card b{display:block;font-size:14px;margin-top:5px}.card small{color:#71808c;font-size:10px}nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #dfe6ee;display:flex;z-index:25}nav button{flex:1;border:0;background:transparent;color:#65737d;font-size:10px;font-weight:800}nav span{display:block;font-size:21px}#cms{display:none;position:fixed;inset:0;background:#eef2f6;z-index:100}.bar{height:56px;background:#075aa8;color:#fff;display:flex;align-items:center;padding:0 8px;gap:7px}.bar b{flex:1}.bar button{background:#ffffff20;color:#fff;border:0;border-radius:9px;padding:9px 12px;font-size:17px}iframe{width:100%;height:calc(100% - 56px);border:0;background:#fff}.note{margin-top:15px;background:#fff8e7;border:1px solid #efd88d;border-radius:15px;padding:13px;font-size:12px;color:#654f18;line-height:1.45}</style></head>
<body><header class="top"><div class="logo">🚆 CMS Mobile</div><button onclick="openCMS()">CMS</button><button onclick="location.reload()">↻</button></header><main><input id="q" class="search" placeholder="🔎 Search CMS feature..." oninput="filter()"><h2>MOST USED</h2><div id="most" class="grid"></div><h2>CREW</h2><div id="crew" class="grid"></div><h2>OPERATIONS</h2><div id="ops" class="grid"></div><h2>OTHER CMS</h2><div id="other" class="grid"></div><div class="note"><b>Official CMS:</b> This is a mobile launcher/interface. Enter your credentials only on the official CRIS CMS page.</div></main>
<nav><button onclick="home()"><span>🏠</span>Home</button><button onclick="document.getElementById('q').focus()"><span>🔎</span>Search</button><button onclick="openCMS()"><span>📋</span>CMS</button><button onclick="alert('CMS Mobile\n\nUse Home for shortcuts. CMS opens the official CRIS CMS. If the CMS server blocks embedding, use the official page normally.')"><span>ℹ️</span>Guide</button></nav>
<section id="cms"><div class="bar"><button onclick="closeCMS()">‹</button><b>Official CMS</b><button onclick="reloadCMS()">↻</button></div><iframe id="f" src="https://cms.indianrail.gov.in/CMSREPORT/JSP/rpt/LoginAction.do?hmode=loginPage"></iframe></section>
<script>
const data=[['👥','Crew Availability','Availability List','most'],['📊','Mileage Report','Avg KM & Hrs','most'],['🔎','Crew Search','Crew Run Detail','most'],['🟢','Crew Status','Crew Status','most'],['👤','Crew Biodata','BIODATA','crew'],['🟩','Sign ON / OFF','SignON/OFF','crew'],['🛤️','Road Learning','Road Learning','crew'],['🎓','Training','Training','crew'],['⏱️','Overtime','Over Time','crew'],['😴','Rest Alert','Rest Alert','crew'],['⚠️','Abnormality','Abnormality','crew'],['📈','Working Hours','Working Hours','crew'],['🚆','Run','Run','ops'],['📋','Non Run','Non Run','ops'],['🏠','Running Room','Running Room','ops'],['📍','Crew Position','Crew Position','ops'],['🚉','Suburban','Suburban','ops'],['📢','SMS','SMS','other'],['🔔','Alert','Alert','other'],['📑','Analysis','Analysis','other'],['📄','Documents','Documents','other'],['⭐','Favourite','Favourite','other'],['🛡️','RB Monitoring','RB Monitoring','other'],['🛡️','RB Safety','RB Safety','other'],['⚙️','Config','Config','other']];
function render(){data.forEach(x=>{let b=document.createElement('button');b.className='card';b.dataset.t=(x[1]+' '+x[2]).toLowerCase();b.innerHTML='<span class="ico">'+x[0]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small>';b.onclick=openCMS;document.getElementById(x[3]).appendChild(b)})}
function filter(){let q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=!q||c.dataset.t.includes(q)?'block':'none')}
function openCMS(){document.getElementById('cms').style.display='block';document.body.style.overflow='hidden'}
function closeCMS(){document.getElementById('cms').style.display='none';document.body.style.overflow='auto'}
function reloadCMS(){document.getElementById('f').src='https://cms.indianrail.gov.in/CMSREPORT/JSP/rpt/LoginAction.do?hmode=loginPage'}
function home(){closeCMS();scrollTo(0,0)}
render();
</script></body></html>
